name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docintel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # Runtime extras are required at import time: conftest builds the app,
        # which wires every router (rag/agent/graph/contracts), so pytest
        # collection imports langchain-core, langgraph, neo4j and pymupdf.
        run: pip install -e ".[dev,serve,kie,contracts,rag,graph,agent]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest
