[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel"
version = "0.1.0"
description = "DocIntel — production-grade Document AI: images to validated, queryable structured data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dang Dang Khoi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-doctr[torch]>=0.8",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
]
# Build-time / data tooling (kept out of the runtime image).
data = [
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "Pillow>=10.3",
    "dvc>=3.51",
]
train = [
    "transformers>=4.40",
    "accelerate>=1.1.0",
    "datasets>=2.18",
    "seqeval>=1.2",
    "Pillow>=10.3",
]
kie = [
    "mlflow>=2.16,<3",
    "boto3>=1.34",
]

[project.scripts]
docintel-download-data = "docintel.scripts.download_data:main"
docintel-import-kie = "docintel.kie.import_run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["docintel"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["datasets.*", "huggingface_hub.*", "cv2.*", "doctr.*", "PIL.*", "seqeval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
pythonpath = ["src"]
markers = [
    "slow: downloads models or runs real OCR; deselected by default",
]
