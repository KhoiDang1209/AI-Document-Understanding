# Local run-time stack for DocIntel.
# Phase 0 brings up the API plus the backing services later phases depend on.
services:
  api:
    build: .
    container_name: docintel-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DOCINTEL_MLFLOW_TRACKING_URI: http://mlflow:5000
      DOCINTEL_MINIO_ENDPOINT: minio:9000
    depends_on:
      - mlflow
      - minio

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: docintel-mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: docintel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mlflow-data:
  minio-data:
