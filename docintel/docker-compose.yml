# Local run-time stack for DocIntel.
# Phase 0 brings up the API plus the backing services later phases depend on.
services:
  api:
    build: .
    container_name: docintel-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DOCINTEL_MLFLOW_TRACKING_URI: http://mlflow:5000
      DOCINTEL_MINIO_ENDPOINT: minio:9000
      # Serve the KIE model from the locally-mounted bundle instead of the
      # MLflow registry (survives a wiped mlflow-data volume; no re-registration).
      DOCINTEL_KIE_ONNX_LOCAL_PATH: /models/cord-layoutlmv3-onnx-int8
      DOCINTEL_QDRANT_URL: http://qdrant:6333
      DOCINTEL_NEO4J_URI: bolt://neo4j:7687
      DOCINTEL_LANGFUSE_HOST: http://langfuse:3000
    volumes:
      - ../models/cord-layoutlmv3-onnx-int8:/models/cord-layoutlmv3-onnx-int8:ro
    depends_on:
      - mlflow
      - minio
      - qdrant
      - neo4j

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: docintel-mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: docintel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: docintel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  loki:
    image: grafana/loki:3.1.1
    container_name: docintel-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    container_name: docintel-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: docintel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: docintel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5.23
    container_name: docintel-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  langfuse-postgres:
    image: postgres:16
    container_name: docintel-langfuse-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: docintel-langfuse
    depends_on:
      - langfuse-postgres
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: local-dev-secret
      SALT: local-dev-salt
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  mlflow-data:
  minio-data:
  prometheus-data:
  loki-data:
  grafana-data:
  qdrant-data:
  neo4j-data:
  langfuse-postgres-data:
